{% extends 'info/base.html' %}

{% block title %}Детали новости{% endblock title %}

{% block content %}
<article class="detail">
    <header class="detail__body">
        <h1 class="page-title ffca">{{ news.title }}</h1>
        <p class="text-muted ffca">{{ news.created_at|date:"d.m.Y" }}</p>
    </header>
    <div class="detail__media">
        <img src="{{ news.image.url }}" class="npimd" alt="{{ news.title }}">
    </div>
    <div class="detail__body">
        <p class="ffca desc-d">{{ news.description }}</p>
    </div>
</article>
{% endblock content %}
