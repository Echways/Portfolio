[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
py_version = 310
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["config", "info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]
